<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Planner</title>
  <link rel="stylesheet" href="planner.css">
</head>
<body>
  <header class="bar">
    <label class="pick">Plan <select id="plan-select" aria-label="Plan file"></select></label>
    <button id="new-plan" type="button">New plan</button>
    <form id="new-plan-form" class="inline-form" hidden>
      <input name="name" required maxlength="64" pattern="[A-Za-z0-9]([A-Za-z0-9 _\-]*[A-Za-z0-9_\-])?"
             aria-label="New plan name" title="Letters, digits, spaces, - and _">
      <button type="submit">Create</button>
      <button type="button" data-act="cancel-new-plan">Cancel</button>
    </form>
    <input id="title" class="title" aria-label="Session title" placeholder="Session title">
    <label>Starts at <input id="starts-at" type="time"></label>
    <label>Length <input id="length" type="number" min="1" step="15"> min</label>
    <label>Snap to <select id="snap"></select> min</label>
    <span class="group" role="group" aria-label="Zoom">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    </span>
    <button id="undo" type="button" disabled aria-keyshortcuts="Control+Z">Undo</button>
    <a id="player-link" class="button" href="players.html" target="_blank" rel="noopener"
       title="The timeline without DCs or rewards, for a second screen or a screen share">Player view</a>
    <span id="save-state" class="save-state" aria-live="polite"></span>
  </header>

  <main id="main">
    <section class="board">
      <p id="clash-note" class="clash-note" hidden></p>
      <div id="timeline-wrap" class="timeline-wrap">
        <div id="timeline" class="tl"></div>
      </div>
      <section id="tray" class="tray" aria-label="Unscheduled activities"></section>
    </section>
    <aside id="editor" class="editor" hidden aria-label="Activity"></aside>
  </main>

  <div id="offline" class="offline" hidden>
    <h1>Session planner</h1>
    <p>This page needs the planner server, which keeps the plan files:</p>
    <pre>node gm-module/planner/server.mjs 8766</pre>
    <p>Then open <code>http://localhost:8766</code>.</p>
  </div>

  <datalist id="checks"></datalist>
  <div id="drag-tip" class="drag-tip" hidden></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <script type="module" src="planner.js"></script>
</body>
</html>
